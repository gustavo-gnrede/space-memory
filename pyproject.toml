[project]
name = "space-memory"
version = "0.1.0"
description = "Shared persistent memory and workspace for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "cryptography>=42,<51",
  "fastapi>=0.116,<1",
  "mcp>=1.20,<2",
  "pydantic>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.35,<1",
]

[project.scripts]
space-memory = "space_memory.cli:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/space_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
